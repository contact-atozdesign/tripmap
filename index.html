<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <style>
        body {
    font-family: sans-serif;
    color:#111
}
        .tripmap-logo {
            display: block;
            margin: 40px auto 20px auto;
        }

        .signinsignup-form {
            width: 90%;
            max-width: 480px;
            margin: auto;
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 60px;
            box-sizing: border-box;
        }

        h1{
            color:goldenrod;
            margin-bottom: 8px;
        }

        #slogan{
            margin:0 0 24px 0;
            font-style: italic;
            font-weight: bold;
            color:grey
        }

        .email-input,
        .password-input {
            box-sizing: border-box;
            display: block;
            width: 100%;
            height: 44px;
            margin: 8px 0;
            padding: 12px;

            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            font-size: 16px;
        }

        
        #grey-p{
            color:grey;
        }

        .signinsignup-btn {
            box-sizing: border-box;
            display: block;
            width: 100%;
            height: 44px;
            margin: 16px 0;
            padding: 12px;

            border: 1px solid goldenrod;
            border-radius: 8px;
            background:goldenrod;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;

        }

        .signingoogle-btn {
            box-sizing: border-box;
            display: block;
            width: 100%;
            height: 44px;
            margin: 8px 0;
            padding: 12px;

            border: 1px solid goldenrod;
            border-radius: 8px;
            background: white;
            font-size: 16px;
            cursor: pointer;
        }

        .divider-wrap {
            display: flex;
            align-items: center;
            width: 100%;
            margin: 20px 0;
        }

        .divider-line {
            flex: 1;
            border: none;
            border-top: 1px solid #ddd;
        }

        .divider-text {
            margin: 0 12px;
            color: grey;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <img class="tripmap-logo" src="tripmap logo.png" width="160"  alt="Tripmap logo" />

    <div class="signinsignup-form">
        <h1>Map it, Trip it!</h1>
        <p id="slogan">Empower your trips with AI mapping.</p><br>

            <label>Email or Phone Number:</label>
            <input class="email-input" type="text" name="email" required><br>
            <label>Password:</label>
            <input class="password-input" type="password" name="password" required><br>
        <button class="signinsignup-btn" type="button" onclick="window.location.href='homepage/index.html'">Sign In / Sign up</button>

        <div class="divider-wrap">
            <hr class="divider-line">
            <span class="divider-text">or</span>
            <hr class="divider-line">
        </div>
        <button class="signingoogle-btn" type="button" onclick="window.location.href='homepage/index.html'">Sign in with Google</button>
        <p id="grey-p">By logging in, you agree to our Terms and Privacy Policy.</p>

    </div>
</body>

</html>
